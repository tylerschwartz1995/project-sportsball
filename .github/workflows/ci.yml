name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  pipeline:
    name: Python pipeline
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pipeline/pyproject.toml

      - name: Install pipeline
        run: python -m pip install -e "pipeline[dev]"

      - name: Lint
        run: |
          python -m ruff check pipeline/src pipeline/tests database/migrations
          python -m ruff format --check pipeline/src pipeline/tests database/migrations

      - name: Type check
        run: |
          python -m pyright \
            --pythonpath "$(python -c 'import sys; print(sys.executable)')" \
            pipeline/src pipeline/tests

      - name: Test
        run: python -m pytest pipeline/tests

  web:
    name: Web application
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix apps/web

      - name: Lint
        run: npm run lint --prefix apps/web

      - name: Type check
        run: npm run typecheck --prefix apps/web

      - name: Build
        run: npm run build --prefix apps/web
