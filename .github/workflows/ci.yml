name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  pipeline:
    name: Python pipeline
    runs-on: ubuntu-latest
    env:
      SPORTSBALL_DATABASE_URL: postgresql+psycopg://sportsball:sportsball@localhost:5432/sportsball_test
      SPORTSBALL_RUN_DATABASE_TESTS: "1"
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: sportsball_test
          POSTGRES_USER: sportsball
          POSTGRES_PASSWORD: sportsball
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sportsball -d sportsball_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.12.0"
          working-directory: pipeline
          enable-cache: true

      - name: Sync pipeline
        run: uv sync --project pipeline --locked

      - name: Lint
        run: |
          uv run --project pipeline --frozen ruff check pipeline/src pipeline/tests database/migrations
          uv run --project pipeline --frozen ruff format --check pipeline/src pipeline/tests database/migrations

      - name: Type check
        run: uv run --project pipeline --frozen pyright pipeline/src pipeline/tests

      - name: Apply database migrations
        run: uv run --project pipeline --frozen alembic --config database/alembic.ini upgrade head

      - name: Verify model metadata matches migrations
        run: uv run --project pipeline --frozen alembic --config database/alembic.ini check

      - name: Test
        run: uv run --project pipeline --frozen pytest pipeline/tests

  web:
    name: Web application
    runs-on: ubuntu-latest
    env:
      SPORTSBALL_DATABASE_URL: postgresql+psycopg://sportsball:sportsball@localhost:5432/sportsball_web_test
      SPORTSBALL_WEB_DATABASE_URL: postgresql://sportsball:sportsball@localhost:5432/sportsball_web_test
      SPORTSBALL_RUN_WEB_FIXTURE_TESTS: "1"
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: sportsball_web_test
          POSTGRES_USER: sportsball
          POSTGRES_PASSWORD: sportsball
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sportsball -d sportsball_web_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix apps/web

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.12.0"
          working-directory: pipeline
          enable-cache: true

      - name: Prepare migrated web fixtures
        run: |
          uv sync --project pipeline --locked
          uv run --project pipeline --frozen alembic --config database/alembic.ini upgrade head
          node scripts/seed-web-test-database.mjs
          uv run --project pipeline --frozen sportsball build-descriptive-analytics

      - name: Verify hosted SQL role isolation
        run: |
          psql "$SPORTSBALL_WEB_DATABASE_URL" -f infra/neon/database-roles.sql
          psql "$SPORTSBALL_WEB_DATABASE_URL" -f scripts/hosted/test-database-roles.sql

      - name: Lint
        run: npm run lint --prefix apps/web

      - name: Type check
        run: npm run typecheck --prefix apps/web

      - name: Test
        run: npm run test --prefix apps/web

      - name: Build
        run: npm run build --prefix apps/web

      - name: Install browser
        run: cd apps/web && npx playwright install --with-deps chromium

      - name: Browser smoke tests
        run: npm run test:browser:smoke --prefix apps/web

  aws-preparation:
    name: AWS preparation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.14.7"
      - name: Check formatting and shell syntax
        run: |
          terraform fmt -check -recursive infra/aws
          terraform fmt -check infra/hosted
          for script in infra/runtime/cloud-init.sh scripts/aws/*.sh; do
            bash -n "$script"
          done
      - name: Validate infrastructure without AWS credentials
        run: |
          for root in bootstrap environment; do
            terraform -chdir=infra/aws/$root init -backend=false -lockfile=readonly
            terraform -chdir=infra/aws/$root validate
            terraform -chdir=infra/aws/$root test
          done
      - name: Validate hosted storage without AWS credentials
        run: |
          terraform -chdir=infra/hosted init -backend=false -lockfile=readonly
          terraform -chdir=infra/hosted validate
          terraform -chdir=infra/hosted test
      - name: Build standalone web image
        run: docker build -f infra/runtime/Dockerfile.web -t sportsball-web:test .
      - name: Verify runtime login boundary
        timeout-minutes: 5
        run: scripts/aws/test-runtime.sh sportsball-web:test
