name: Manual ingestion health check
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ingestion-health
  cancel-in-progress: false
jobs:
  health:
    if: github.ref == 'refs/heads/main' && vars.HOSTED_JOBS_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HOSTED_JOBS_ENABLED: ${{ vars.HOSTED_JOBS_ENABLED }}
      JOB_MODE: health
      SPORTSBALL_DATABASE_URL: ${{ secrets.SPORTSBALL_READONLY_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.12.0"
      - run: uv sync --project pipeline --locked --no-dev
      - run: uv run --project pipeline --frozen --no-dev python scripts/hosted/run-job.py
