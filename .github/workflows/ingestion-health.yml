name: Manual ingestion health check
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: ingestion-health
  cancel-in-progress: false
jobs:
  health:
    if: github.ref == 'refs/heads/main' && vars.HOSTED_JOBS_ENABLED == 'true'
    environment: sportsball-production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HOSTED_JOBS_ENABLED: ${{ vars.HOSTED_JOBS_ENABLED }}
      JOB_MODE: health
      SPORTSBALL_DATABASE_URL: ${{ secrets.SPORTSBALL_READONLY_DATABASE_URL }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.12.0"
      - run: uv sync --project pipeline --locked --no-dev
      - run: uv run --project pipeline --frozen --no-dev python scripts/hosted/run-job.py
      # Exercise temporary credentials without writing database or S3 data.
      - name: Verify ingestion role trust
        uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c # v4
        with:
          role-to-assume: ${{ vars.SPORTSBALL_INGESTION_AWS_ROLE_ARN }}
          aws-region: us-west-2
          allowed-account-ids: "989240880464"
      - name: Verify backup role trust
        uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c # v4
        with:
          role-to-assume: ${{ vars.SPORTSBALL_BACKUP_AWS_ROLE_ARN }}
          aws-region: us-west-2
          allowed-account-ids: "989240880464"
          unset-current-credentials: true
