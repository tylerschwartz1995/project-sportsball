name: Daily ingestion

on:
  schedule:
    # One morning publication per day. UTC is explicit.
    - cron: "17 15 * * *"
  workflow_dispatch:
    inputs:
      run_date:
        description: Optional UTC date override (YYYY-MM-DD)
        required: false
        type: string
      season_id:
        description: Optional eight-digit NHL season override
        required: false
        type: string
      skip_moneypuck:
        description: Skip MoneyPuck refreshes
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

defaults:
  run:
    shell: bash

concurrency:
  group: daily-ingestion
  cancel-in-progress: false

jobs:
  update:
    name: Refresh current data
    if: github.ref == 'refs/heads/main' && vars.HOSTED_JOBS_ENABLED == 'true' && (github.event_name == 'workflow_dispatch' || vars.DAILY_INGESTION_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      HOSTED_JOBS_ENABLED: ${{ vars.HOSTED_JOBS_ENABLED }}
      JOB_MODE: ingestion
      SPORTSBALL_DATABASE_URL: ${{ secrets.SPORTSBALL_DATABASE_URL }}
      SPORTSBALL_ARTIFACT_S3_BUCKET: ${{ vars.SPORTSBALL_ARCHIVE_BUCKET }}
      AWS_ROLE_CONFIGURED: ${{ vars.SPORTSBALL_INGESTION_AWS_ROLE_ARN }}
      SPORTSBALL_WEB_URL: ${{ vars.SPORTSBALL_WEB_URL }}
      SPORTSBALL_REVALIDATION_TOKEN: ${{ secrets.SPORTSBALL_REVALIDATION_TOKEN }}
      INPUT_RUN_DATE: ${{ inputs.run_date }}
      INPUT_SEASON_ID: ${{ inputs.season_id }}
      INPUT_SKIP_MONEYPUCK: ${{ inputs.skip_moneypuck }}
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.12.0"
          working-directory: pipeline
          enable-cache: true
      - name: Install pipeline
        run: uv sync --project pipeline --locked --no-dev
      - name: Obtain temporary S3 credentials
        uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c # v4
        with:
          role-to-assume: ${{ vars.SPORTSBALL_INGESTION_AWS_ROLE_ARN }}
          role-duration-seconds: 7200
          aws-region: us-west-2
          allowed-account-ids: "989240880464"
      - name: Verify schema, ingest and check health
        run: uv run --project pipeline --frozen --no-dev python scripts/hosted/run-job.py
      - name: Summarize run
        if: ${{ !cancelled() }}
        env:
          JOB_STATUS: ${{ job.status }}
        run: echo "Ingestion and health status = $JOB_STATUS. See step logs and database audits." >> "$GITHUB_STEP_SUMMARY"
